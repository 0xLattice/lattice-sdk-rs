[package]
name = "lattice-sdk"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
[dependencies]
lattice-light-client = { path = "../lattice-light-client-rs" }
futures-util = "0.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
lattice-primitives = { path = "../lattice-rs/crates/lattice-primitives" }
lattice-cashew = { path = "../cashew-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
thiserror = "2"
base64 = "0.22"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["time", "macros", "rt"] }
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.10"
data-encoding = "2"
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
web-time = "1"
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures-channel = "0.3"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "Request", "RequestInit", "RequestRedirect", "RequestCredentials", "Response", "Headers", "ReadableStream", "ReadableStreamDefaultReader"] }
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread"] }

[[example]]
name = "browser_smoke"
crate-type = ["cdylib"]
